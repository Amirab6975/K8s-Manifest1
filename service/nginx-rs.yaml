apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-rs
  namespace: aboli
spec:
  replicas: 3
  selector:
    # matchLabels:
    #   app: item
    matchExpressions:
      - key: app
        operator: In
        values:
          - item  
  template:
    metadata:
      labels:
        app: item
    spec:
      containers:
      - name: nginx-container
        image: nginx:latest
        ports:
          - containerPort: 80
            name: http
          - containerPort: 443
            name: https
