apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: aboli
spec:
  replicas: 3
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - item  
  template:
    metadata:
      labels:
        app: item
    spec:
      #      affinity:
      #  nodeAffinity:
      #    requiredDuringSchedulingIgnoredDuringExecution:
      #      nodeSelectorTerms:
      #      - matchExpressions:
      #        - key: gpu
      #          operator: In
      #          values:
      #          - "true"
      preferreDuringSchedulingIgnoredDuringExecution:
        - weight: 80
          preference:
            matchExpressions:
            - key: availability-zone
              operator: In
              values:
              - tehran
        - weight: 20
          preference:
            matchExpressions:
            - key: share-type
              operator: In
              values: availability-zone
              - qom
      containers:
      - name: nginx-container
        image: nginx:1.27.2
        ports:
          - containerPort: 80
            name: http
