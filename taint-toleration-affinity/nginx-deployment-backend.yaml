apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment-bc
  namespace: aboli
spec:
  replicas: 5
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - item2  
  template:
    metadata:
      labels:
        app: item2
    spec:
      affinity:
        #    podAffinity:
        #      requiredDuringSchedulingIgnoredDuringExecution:
        #      - topologyKey: kubernetes.io/hostname
        #        labelSelector: 
        #          matchLabels:
        #            app: item
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                  app: item
      containers:
      - name: nginx-container
        image: nginx:1.27.2
        ports:
          - containerPort: 80
            name: http
          - containerPort: 443
            name: https
