apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment-front
  namespace: aboli
spec:
  replicas: 5
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - item  
  template:
    metadata:
      labels:
        app: item
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: gpu
                operator: In
                values:
                - "true"
      containers:
      - name: nginx-container
        image: nginx:1.27.2
        ports:
          - containerPort: 80
            name: http
          - containerPort: 443
            name: https
