apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: aboli
spec:
  replicas: 3
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - item  
  template:
    metadata:
      labels:
        app: item
    spec:
      tolerations:
      - key: node-type
        operator: "Equal"
        value: production
        effect: NoSchedule
      - key: node.kubernetes.io/unreachable
        operator: "Exists"
        effect: NoExecute
        tolerationSeconds: 300
      containers:
      - name: nginx-container
        image: nginx:1.27.2
        ports:
          - containerPort: 80
            name: http
          - containerPort: 443
            name: https
