apiVersion: v1
kind: Pod
metadata:
  name: pod-limit
  namespace: aboli
spec:
  containers:
  - name: main
    image: busybox
    command: ["dd", "if=/dev/zero", "of=/dev/null"]
    resources:  
      requests:
        cpu: 500m
        memory: 10Mi
      limits:
        cpu: 1
        memory: 20Mi
