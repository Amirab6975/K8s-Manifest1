apiVersion: v1
kind: Pod
metadata:
  name: volume-fsgroup
  namespace: aboli
spec:
  securityContext:
    fsGroup: 555
    supplementalGroups: [666, 777]
  containers:
  - name: first
    image:  alpine
    command:  ["/bin/sleep", "99999"]
    securityContext:
      runAsUser: 1111
    volumeMounts:
    - name: shared-vol
      mountPath:  /volume
      readOnly: false
  - name: second
    image:  alpine
    command:  ["/bin/sleep", "99999"]
    securityContext:
      runAsUser: 2222
    volumeMounts:
    - name: shared-vol
      mountPath:  /volume
      readOnly: false
  volumes:
  - name: shared-vol
    emptyDir: {}
